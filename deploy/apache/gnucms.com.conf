<VirtualHost *:80>
    ServerName gnucms.com
    ServerAdmin webmaster@localhost
    DocumentRoot /home/kagla/_gnucms.com/www

    <Directory /home/kagla/_gnucms.com/www>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <Files "install.php">
            Require all denied
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gnucms.com-error.log
    CustomLog ${APACHE_LOG_DIR}/gnucms.com-access.log combined
</VirtualHost>
