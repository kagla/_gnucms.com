name: Release
run-name: GNUCMS v${{ inputs.version }} 릴리스

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (v 없이 X.Y.Z 입력, 예: 0.8.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo '::error::Release는 main 브랜치에서 실행해야 합니다.'
            exit 1
          fi

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, openssl, phar, zip
          coverage: none
          tools: composer:v2

      - name: Prepare version, changelog and release commit
        id: prepare
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::버전은 v 없이 X.Y.Z 형식으로 입력해야 합니다.'
            exit 1
          fi
          RELEASE_TAG="v${RELEASE_VERSION}"
          export RELEASE_TAG
          release_state="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .draft")"
          if [ "${release_state}" = false ]; then
            echo '::error::이미 공개된 릴리스입니다. 기존 태그와 배포 파일을 덮어쓰지 않습니다.'
            exit 1
          fi
          cp .github/scripts/prepare-release.php "${RUNNER_TEMP}/gnucms-prepare-release.php"
          main_version="$(cat version.txt)"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" HEAD
            git checkout --detach "${RELEASE_TAG}"
            if [ "$(cat version.txt)" != "${RELEASE_VERSION}" ]; then
              echo '::error::기존 태그와 version.txt의 버전이 일치하지 않습니다.'
              exit 1
            fi
            echo 'reuse_tag=true' >> "${GITHUB_OUTPUT}"
          else
            if [ -n "${release_state}" ]; then
              echo '::error::릴리스 초안의 태그가 없습니다. 기존 초안을 먼저 확인해 주세요.'
              exit 1
            fi
            echo 'reuse_tag=false' >> "${GITHUB_OUTPUT}"
          fi
          php "${RUNNER_TEMP}/gnucms-prepare-release.php" "${RELEASE_VERSION}" "${RUNNER_TEMP}/gnucms-release-notes.md" "${main_version}"
          if [ "$(git branch --show-current)" = main ]; then
            git add version.txt CHANGELOG.md
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: release ${RELEASE_VERSION}"
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "${RELEASE_TAG}" -m "GNUCMS ${RELEASE_TAG}"
          fi
          echo "draft=${release_state:-false}" >> "${GITHUB_OUTPUT}"

      - name: Prepare production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build deployment archive
        run: |
          package="gnucms-${RELEASE_VERSION}"
          mkdir -p "build/${package}"
          git archive HEAD | tar -x -C "build/${package}"
          cp -a vendor "build/${package}/vendor"
          kcp_bin="build/${package}/storage/payment/kcp_legacy/bin"
          kcp_source="https://raw.githubusercontent.com/gnuboard/g7-plugin-sirsoft-pay_nhnkcp/0e02e7dae01523f227688ffefcdda04d9b1d6421/bin"
          mkdir -p "${kcp_bin}"
          curl -fsSL --retry 3 -o "${kcp_bin}/pp_cli_x64" "${kcp_source}/pp_cli_x64"
          curl -fsSL --retry 3 -o "${kcp_bin}/pp_cli_exe.exe" "${kcp_source}/pp_cli_exe.exe"
          curl -fsSL --retry 3 -o "${kcp_bin}/pub.key" "${kcp_source}/pub.key"
          test "$(git hash-object "${kcp_bin}/pp_cli_x64")" = 4707f2c1a7d346331c4d135974671d35173557bf
          test "$(git hash-object "${kcp_bin}/pp_cli_exe.exe")" = cb05cd57a5143d7abe6ac0edcb07ed4f707243bd
          test "$(git hash-object "${kcp_bin}/pub.key")" = 8b0c51e4ee90e4d84396cebc8720e1b143273605
          chmod 755 "${kcp_bin}/pp_cli_x64"
          rm -rf "build/${package}/.github" "build/${package}/tests"
          test -f "build/${package}/vendor/autoload.php"
          (cd build && zip -qr "${package}.zip" "${package}")
          unzip -tq "build/${package}.zip"
          (cd build && sha256sum "${package}.zip" > "${package}.zip.sha256")

      - name: Push release commit and tag together
        if: steps.prepare.outputs.reuse_tag != 'true'
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/v${RELEASE_VERSION}"

      - name: Create release draft
        if: steps.prepare.outputs.draft != 'true'
        run: |
          gh release create "v${RELEASE_VERSION}" --verify-tag --draft \
            --title "GNUCMS v${RELEASE_VERSION}" \
            --notes-file "${RUNNER_TEMP}/gnucms-release-notes.md"

      - name: Attach deployment archive
        run: |
          gh release upload "v${RELEASE_VERSION}" \
            "build/gnucms-${RELEASE_VERSION}.zip" \
            "build/gnucms-${RELEASE_VERSION}.zip.sha256" --clobber

      - name: Publish release
        run: |
          gh release edit "v${RELEASE_VERSION}" --draft=false --latest \
            --title "GNUCMS v${RELEASE_VERSION}" \
            --notes-file "${RUNNER_TEMP}/gnucms-release-notes.md"
          echo "### GNUCMS v${RELEASE_VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}" >> "${GITHUB_STEP_SUMMARY}"
